<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный дом</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Библиотека для перетаскивания -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Темный фон */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; }

        /* ШАПКА */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left { display: flex; align-items: center; gap: 20px; }
        
        .app-title {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }
        .app-title i { color: #8b5cf6; }

        .header-right { display: flex; align-items: center; gap: 20px; }

        .clock-widget {
            text-align: right;
            font-family: 'Inter', sans-serif;
        }
        .clock-time { font-size: 32px; font-weight: 700; line-height: 1; }
        .clock-date { font-size: 14px; color: #94a3b8; margin-top: 4px; text-transform: capitalize; }

        .btn-add {
            background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.5);
            padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; display: none; align-items: center; gap: 8px;
        }
        .btn-add:hover { background: rgba(139, 92, 246, 0.4); color: #fff; }

        /* СЕТКА КАРТОЧЕК */
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        /* КАРТОЧКА - Стекло */
        .switch-card {
            background: rgba(30, 41, 59, 0.3); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 30px 25px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            cursor: pointer;
            user-select: none;
        }

        .switch-card:hover {
            background: rgba(30, 41, 59, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Название устройства */
        .switch-card h3 {
            font-size: 20px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 20px;
            width: 100%;
        }

        /* БОЛЬШАЯ КРУГЛАЯ КНОПКА ПИТАНИЯ */
        .main-button {
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            border: none; 
            cursor: pointer;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 50px; 
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            margin-bottom: 20px;
            position: relative; 
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.2);
        }

        /* ВЫКЛЮЧЕНО (Серый градиент) */
        .switch-card.is-off .main-button { 
            background: linear-gradient(135deg, #475569 0%, #334155 100%); 
            color: #94a3b8; /* Иконка становится сероватой */
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.2), 0 10px 25px rgba(0, 0, 0, 0.2); 
        }

        /* ВКЛЮЧЕНО (Зеленый градиент) */
        .switch-card.is-on .main-button { 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); 
            color: white;
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.1), 0 10px 25px rgba(56, 239, 125, 0.4); 
            animation: pulse-green 2s infinite; 
        }

        @keyframes pulse-green { 
            0% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.5); } 
            70% { box-shadow: 0 0 0 20px rgba(56, 239, 125, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0); } 
        }

        .main-button:active { transform: scale(0.92); }

        /* Статус */
        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        /* Вспомогательные элементы (Админ) */
        .device-id {
            font-size: 10px; color: #475569; margin-top: 5px; font-family: monospace;
            display: none; width: 100%; overflow: hidden; text-overflow: ellipsis;
        }
        .btn-delete {
            position: absolute; top: 15px; right: 15px;
            background: rgba(239, 68, 68, 0.1); color: #ef4444;
            border: none; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; display: none; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #ef4444; color: white; }

        body.is-admin .device-id { display: block; }
        body.is-admin .btn-delete { display: flex; }
        body.is-admin .btn-add { display: flex; }
        body.is-admin .switch-card { cursor: grab; border: 1px dashed rgba(255,255,255,0.2); }
        body.is-admin .switch-card:active { cursor: grabbing; }

        .sortable-ghost { opacity: 0.3; background: rgba(139, 92, 246, 0.1); }

        /* МОДАЛЬНОЕ ОКНО */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .modal-content h2 { margin-bottom: 20px; color: #f8fafc; font-size: 22px; }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; }
        .input-group input { width: 100%; padding: 14px 14px 14px 45px; border: 1px solid #334155; border-radius: 12px; font-size: 15px; background: #0f172a; color: #fff; transition: all 0.2s; }
        .input-group input:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 25px; }
        .modal-buttons button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 15px; }
        .modal-buttons .save { background: #8b5cf6; color: white; }
        .modal-buttons .save:hover { background: #7c3aed; }
        .modal-buttons .cancel { background: #334155; color: #cbd5e1; }
        .modal-buttons .cancel:hover { background: #475569; }

        /* УВЕДОМЛЕНИЯ */
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; padding: 15px 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; transform: translateX(150%); transition: transform 0.3s ease; z-index: 2000; border-left: 5px solid #10b981; font-weight: 500; color: #fff; }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: #ef4444; }
        .toast i { font-size: 20px; color: #10b981; }
        .toast.error i { color: #ef4444; }

        .loader-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(3px); z-index: 3000; justify-content: center; align-items: center; }
        .loader-overlay.active { display: flex; }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top: 4px solid #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px; background: rgba(30, 41, 59, 0.3); border: 2px dashed rgba(255, 255, 255, 0.1); border-radius: 20px; color: #94a3b8; }
        .empty-state i { font-size: 50px; margin-bottom: 15px; opacity: 0.7; }
        .empty-state p { font-size: 18px; }
    </style>
</head>
<body>

    <div class="loader-overlay" id="loader"><div class="spinner"></div></div>
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Успешно</span></div>

    <div class="container">
        <header>
            <div class="header-left">
                <div class="app-title">
                    <i class="fas fa-home"></i> Умный дом
                </div>
                <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> Добавить</button>
            </div>
            
            <div class="header-right">
                <div class="clock-widget">
                    <div class="clock-time" id="clock-time">00:00</div>
                    <div class="clock-date" id="clock-date">Загрузка...</div>
                </div>
            </div>
        </header>

        <div class="devices-grid" id="grid"></div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Новое устройство</h2>
            <div class="input-group">
                <i class="fas fa-tag"></i>
                <input type="text" id="inpName" placeholder="Название (напр. Лампа Спальня)">
            </div>
            <div class="input-group">
                <i class="fas fa-microchip"></i>
                <input type="text" id="inpId" placeholder="Tuya Device ID">
            </div>
            <div class="modal-buttons">
                <button class="save" onclick="addDevice()">Сохранить</button>
                <button class="cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ВАШИ КЛЮЧИ SUPABASE (ЗАМЕНИТЕ ЗДЕСЬ)
        // ==========================================
        const SUPABASE_PROJECT_URL = 'https://apnqvsexgebvzqozlfmo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_onLn9Ip6zF26jb61VZvX7Q_oUjejgJf'; 
        const SUPABASE_FUNCTION_URL = 'https://apnqvsexgebvzqozlfmo.supabase.co/functions/v1/toggle-device';
        const SUPABASE_FUNCTION_KEY = 'sb_publishable_onLn9Ip6zF26jb61VZvX7Q_oUjejgJf';

        let devices = [];
        let sortableInstance = null;

        // ==========================================
        // ЧАСЫ
        // ==========================================
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
            
            document.getElementById('clock-time').textContent = timeStr;
            document.getElementById('clock-date').textContent = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ==========================================
        // БАЗА ДАННЫХ
        // ==========================================
        async function loadDevicesFromDb() {
            setLoading(true);
            try {
                const res = await fetch(`${SUPABASE_PROJECT_URL}/rest/v1/devices?select=*&order=sort_order.asc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                devices = await res.json();
                renderDevices();
                initSortable();
            } catch (error) { showToast('Ошибка загрузки', true); } finally { setLoading(false); }
        }

        async function addDeviceToDb(name, tuyaId) {
            setLoading(true);
            try {
                const order = Date.now(); 
                await fetch(`${SUPABASE_PROJECT_URL}/rest/v1/devices`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ name: name, tuya_id: tuyaId, is_on: false, sort_order: order })
                });
                loadDevicesFromDb();
            } catch (error) { showToast('Ошибка сохранения', true); } finally { setLoading(false); }
        }

        async function deleteDeviceFromDb(id) {
            setLoading(true);
            try {
                await fetch(`${SUPABASE_PROJECT_URL}/rest/v1/devices?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                loadDevicesFromDb();
            } catch (error) { showToast('Ошибка удаления', true); } finally { setLoading(false); }
        }

        async function updateStatusInDb(id, isOn) {
            await fetch(`${SUPABASE_PROJECT_URL}/rest/v1/devices?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_on: isOn })
            });
        }

        async function updateOrderInDb(orderedIds) {
            try {
                for (let i = 0; i < orderedIds.length; i++) {
                    await fetch(`${SUPABASE_PROJECT_URL}/rest/v1/devices?id=eq.${orderedIds[i]}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sort_order: i })
                    });
                }
                showToast('Порядок сохранен');
            } catch (e) { showToast('Ошибка сохранения порядка', true); }
        }

        // ==========================================
        // ИНТЕРФЕЙС
        // ==========================================
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') document.body.classList.add('is-admin');
            loadDevicesFromDb();
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.className = isError ? 'toast show error' : 'toast show';
            toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function setLoading(show) { document.getElementById('loader').classList.toggle('active', show); }
        function openModal() { document.getElementById('inpName').value = ''; document.getElementById('inpId').value = ''; document.getElementById('modal').classList.add('active'); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function addDevice() {
            const name = document.getElementById('inpName').value.trim();
            const id = document.getElementById('inpId').value.trim();
            if (!name || !id) return showToast('Заполните все поля', true);
            addDeviceToDb(name, id);
            closeModal();
        }

        function deleteDevice(id, event) {
            event.stopPropagation(); 
            if (!confirm('Удалить это устройство?')) return;
            deleteDeviceFromDb(id);
        }

        function renderDevices() {
            const grid = document.getElementById('grid');
            if (devices.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-satellite-dish"></i><p>Нет добавленных устройств</p></div>`;
                return;
            }

            let html = '';
            devices.forEach(dev => {
                const cardClass = dev.is_on ? 'is-on' : 'is-off';
                const statusText = dev.is_on ? 'Включено' : 'Выключено';

                html += `
                    <div class="switch-card ${cardClass}" data-id="${dev.id}" onclick="toggleTuya('${dev.id}', ${dev.is_on})">
                        <button class="btn-delete" onclick="deleteDevice(${dev.id}, event)">
                            <i class="fas fa-trash"></i>
                        </button>
                        
                        <h3>${dev.name}</h3>
                        
                        <!-- Круглая кнопка -->
                        <div class="main-button">
                            <i class="fas fa-power-off"></i>
                        </div>
                        
                        <div class="status-text">${statusText}</div>
                        <div class="device-id">${dev.tuya_id}</div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function initSortable() {
            const grid = document.getElementById('grid');
            if (sortableInstance) sortableInstance.destroy();

            if (!document.body.classList.contains('is-admin')) return;

            sortableInstance = new Sortable(grid, {
                animation: 250,
                ghostClass: "sortable-ghost",
                onEnd: function (evt) {
                    const items = grid.querySelectorAll('.switch-card');
                    const newOrderIds = Array.from(items).map(item => item.getAttribute('data-id'));
                    updateOrderInDb(newOrderIds);
                }
            });
        }

        async function toggleTuya(dbId, currentState) {
            const newState = currentState ? 0 : 1; 
            const dev = devices.find(d => d.id == dbId);
            if (!dev) return;

            // Мгновенное обновление UI
            const card = document.querySelector(`.switch-card[data-id="${dbId}"]`);
            if (newState === 1) {
                card.classList.remove('is-off'); card.classList.add('is-on');
                card.querySelector('.status-text').textContent = 'Включено';
            } else {
                card.classList.remove('is-on'); card.classList.add('is-off');
                card.querySelector('.status-text').textContent = 'Выключено';
            }

            setLoading(true);
            try {
                const response = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_FUNCTION_KEY,
                        'Authorization': `Bearer ${SUPABASE_FUNCTION_KEY}`
                    },
                    body: JSON.stringify({ deviceId: dev.tuya_id, state: newState })
                });

                const data = await response.json();
                if (data.success === true) {
                    await updateStatusInDb(dbId, newState === 1);
                    setTimeout(() => loadDevicesFromDb(), 500);
                } else {
                    showToast('Ошибка: ' + (data.msg || 'Неизвестно'), true);
                    loadDevicesFromDb(); 
                }
            } catch (error) { 
                showToast('Ошибка сети', true); 
                loadDevicesFromDb();
            } finally { 
                setLoading(false); 
            }
        }
    </script>
</body>
</html>
