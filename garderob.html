<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гардероб с Firebase</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js">
  </script>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f4f6fa;
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }
    .app {
      max-width: 1300px;
      width: 100%;
    }
    .wardrobe-card {
      background: #fff;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      padding: 2rem 2rem 2.5rem;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.9rem;
      color: #1e293b;
      margin-bottom: 1.5rem;
    }
    h1 small {
      font-size: 0.95rem;
      font-weight: 400;
      color: #64748b;
      margin-left: 0.5rem;
    }
    .top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stats {
      background: #f1f5f9;
      padding: 0.4rem 1.4rem;
      border-radius: 40px;
      font-size: 0.95rem;
    }
    .stats span {
      font-weight: 600;
    }
    .category-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 0.8rem;
      margin: 1.5rem 0 2rem;
    }
    .category-pill {
      background: #eef2f6;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid transparent;
      user-select: none;
    }
    .category-pill:hover {
      background: #dce2ec;
      transform: scale(0.96);
    }
    .category-pill.active {
      background: #1e293b;
      color: white;
    }
    .add-section {
      background: #f8fafc;
      border-radius: 1.5rem;
      padding: 1.5rem 1.8rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem 1.2rem;
      border: 1px solid #e2e8f0;
    }
    .add-section .field {
      flex: 1 0 140px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .add-section .field label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #475569;
    }
    .add-section .field input,
    .add-section .field select {
      background: white;
      border: 1px solid #d1d9e6;
      border-radius: 12px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }
    .add-section .field input:focus,
    .add-section .field select:focus {
      border-color: #7c8db0;
      box-shadow: 0 0 0 3px rgba(124, 141, 176, 0.15);
    }
    .file-field {
      flex: 0.8 0 160px;
    }
    .file-field input {
      padding: 0.4rem;
    }
    .btn {
      background: #1e293b;
      color: white;
      border: none;
      font-weight: 500;
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) {
      background: #0f172a;
      transform: scale(0.97);
    }
    .btn-outline {
      background: transparent;
      color: #1e293b;
      border: 1px solid #d1d9e6;
    }
    .btn-outline:hover:not(:disabled) {
      background: #f1f5f9;
      transform: none;
    }
    .btn-danger {
      background: #b91c1c;
    }
    .btn-danger:hover:not(:disabled) {
      background: #991b1b;
    }
    .btn-sm {
      padding: 0.25rem 0.9rem;
      font-size: 0.8rem;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.2rem;
      margin: 1.5rem 0 1rem;
    }
    .item-card {
      background: #fcfcfd;
      border-radius: 1.2rem;
      border: 1px solid #e9edf2;
      padding: 0.9rem 0.9rem 1rem;
      transition: 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .item-card:hover {
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
    }
    .item-card .image-wrapper {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 1rem;
      background: #eef2f6;
      overflow: hidden;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .item-card .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .item-card .image-wrapper .placeholder {
      font-size: 2.5rem;
      color: #94a3b8;
    }
    .item-card .name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .item-card .category {
      font-size: 0.75rem;
      color: #475569;
      background: #e9edf2;
      padding: 0.15rem 0.8rem;
      border-radius: 20px;
      display: inline-block;
      margin: 0.2rem 0;
    }
    .item-card .color {
      font-size: 0.75rem;
      color: #334155;
    }
    .item-card .actions {
      margin-top: 0.4rem;
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      background: white;
      max-width: 700px;
      width: 100%;
      max-height: 80vh;
      border-radius: 2rem;
      padding: 2rem;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
      position: relative;
    }
    .modal h2 {
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal .close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #475569;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
    }
    .modal-grid .item-card {
      background: #f8fafc;
    }
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .loading-indicator {
      display: none;
      text-align: center;
      padding: 0.5rem;
      color: #475569;
      font-size: 0.9rem;
    }
    .loading-indicator.active {
      display: block;
    }
    .error-message {
      color: #b91c1c;
      background: #fee2e2;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      margin: 0.5rem 0;
      display: none;
    }
    .error-message.active {
      display: block;
    }
    @media (max-width: 640px) {
      .wardrobe-card {
        padding: 1.25rem;
      }
      .add-section {
        flex-direction: column;
        align-items: stretch;
      }
      .add-section .field {
        flex: 1 1 auto;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="wardrobe-card">
      <h1>🧥 Гардероб <small>Firebase</small></h1>
      <div class="top-row">
        <div class="stats">👕 всего: <span id="itemCount">0</span></div>
        <div>
          <button class="btn btn-outline btn-sm" id="clearAllBtn">🗑️ очистить</button>
        </div>
      </div>

      <div class="category-grid" id="categoryContainer"></div>

      <div class="add-section">
        <div class="field">
          <label for="itemName">Название</label>
          <input type="text" id="itemName" placeholder="Джинсы" />
        </div>
        <div class="field">
          <label for="itemCategory">Категория</label>
          <select id="itemCategory">
            <option value="Куртки">Куртки</option>
            <option value="Желетки">Желетки</option>
            <option value="Свитера">Свитера</option>
            <option value="Майки">Майки</option>
            <option value="Рубашки">Рубашки</option>
            <option value="Штаны">Штаны</option>
            <option value="Брюки">Брюки</option>
			<option value="Шорты">Шорты</option>
            <option value="Сп.Штаны">Сп.Штаны</option>
            <option value="Сп.Кофта">Сп.Кофта</option>
            <option value="Ветровки" selected>Ветровки</option>
            <option value="Обувь">Обувь</option>
            <option value="Аксессуары">Аксессуары</option>
            <option value="Другое">Другое</option>
          </select>
        </div>
        <div class="field">
          <label for="itemColor">Цвет</label>
          <select id="itemColor">
            <option value="белый">белый</option>
            <option value="черный">черный</option>
            <option value="серый">серый</option>
            <option value="синий">синий</option>
            <option value="красный">красный</option>
            <option value="зеленый">зеленый</option>
            <option value="желтый">желтый</option>
            <option value="коричневый">коричневый</option>
            <option value="оранжевый">оранжевый</option>
            <option value="розовый">розовый</option>
            <option value="фиолетовый">фиолетовый</option>
            <option value="голубой">голубой</option>
            <option value="бежевый">бежевый</option>
            <option value="хаки">хаки</option>
          </select>
        </div>
        <div class="field file-field">
          <label for="itemImage">Фото</label>
          <input type="file" id="itemImage" accept="image/*" />
        </div>
        <div class="field" style="flex: 0.5 0 100px;">
          <label>&nbsp;</label>
          <button class="btn" id="addBtn">➕ Добавить</button>
        </div>
      </div>
      <div class="loading-indicator" id="uploadIndicator">⏳ Загрузка фото...</div>
      <div class="error-message" id="errorMessage"></div>

      <div id="itemsGrid" class="items-grid"></div>

      <div class="footer-actions">
        <button class="btn btn-outline btn-sm" id="exportJsonBtn">⬇️ Экспорт JSON</button>
        <button class="btn btn-outline btn-sm" id="importJsonBtn">⬆️ Импорт JSON</button>
        <input type="file" id="fileInput" accept=".json" style="display:none" />
      </div>
    </div>

    <div class="modal-overlay" id="categoryModal">
      <div class="modal">
        <h2>
          <span id="modalTitle">Категория</span>
          <button class="close-btn" id="modalCloseBtn">&times;</button>
        </h2>
        <div class="modal-grid" id="modalGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBOZTdqSwRb2SADam7G-Tsk1cMH0rMRCiY",
      authDomain: "isotalcd.firebaseapp.com",
      databaseURL: "https://isotalcd-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "isotalcd",
      storageBucket: "isotalcd.firebasestorage.app",
      messagingSenderId: "201976654278",
      appId: "1:201976654278:web:e017a777e73efe3ab4eac7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    let allItems = [];
    let isUploading = false;

    const itemsGrid = document.getElementById('itemsGrid');
    const itemCount = document.getElementById('itemCount');
    const categoryContainer = document.getElementById('categoryContainer');
    const modalOverlay = document.getElementById('categoryModal');
    const modalGrid = document.getElementById('modalGrid');
    const modalTitle = document.getElementById('modalTitle');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const uploadIndicator = document.getElementById('uploadIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const addBtn = document.getElementById('addBtn');

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('active');
      setTimeout(() => errorMessage.classList.remove('active'), 5000);
    }

    function loadFromFirebase() {
      const ref = db.ref('wardrobe');
      ref.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          allItems = Object.keys(data).map(key => ({
            id: key,
            ...data[key]
          }));
        } else {
          allItems = [];
        }
        renderAll();
      });
    }

    function saveItemToFirebase(item) {
      const ref = db.ref('wardrobe');
      const newRef = ref.push();
      return newRef.set(item).then(() => newRef.key);
    }

    function deleteItemFromFirebase(id) {
      return db.ref('wardrobe/' + id).remove();
    }

    function updateItemInFirebase(id, updated) {
      return db.ref('wardrobe/' + id).update(updated);
    }

    function uploadImage(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Пожалуйста, выберите изображение'));
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          reject(new Error('Размер файла не должен превышать 5MB'));
          return;
        }

        const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
        const storageRef = storage.ref('wardrobe_images/' + fileName);
        
        const metadata = {
          contentType: file.type,
          cacheControl: 'public, max-age=31536000'
        };

        const uploadTask = storageRef.put(file, metadata);
        
        uploadTask.on('state_changed',
          (snapshot) => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            console.log('Upload progress:', Math.round(progress) + '%');
          },
          (error) => {
            console.error('Upload error:', error);
            let errorMsg = 'Ошибка загрузки: ';
            if (error.code === 'storage/unauthorized') {
              errorMsg += 'Нет прав для загрузки. Проверьте правила безопасности.';
            } else if (error.code === 'storage/canceled') {
              errorMsg += 'Загрузка отменена.';
            } else {
              errorMsg += error.message || 'Неизвестная ошибка';
            }
            reject(new Error(errorMsg));
          },
          () => {
            storageRef.getDownloadURL().then((url) => {
              console.log('Upload complete, URL:', url);
              resolve(url);
            }).catch((err) => {
              reject(new Error('Не удалось получить URL: ' + err.message));
            });
          }
        );
      });
    }

    function renderAll() {
      renderItems(allItems);
      renderCategories(allItems);
      itemCount.textContent = allItems.length;
    }

    function renderItems(itemsArray) {
      if (!itemsArray.length) {
        itemsGrid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#64748b; padding:2rem;">Пока ничего нет. Добавьте вещь!</p>`;
        return;
      }
      let html = '';
      itemsArray.forEach(item => {
        const imageHtml = item.imageUrl ?
          `<img src="${item.imageUrl}" alt="${item.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>📷</div>'" />` :
          `<div class="placeholder">📷</div>`;
        
        html += `
          <div class="item-card" data-id="${item.id}">
            <div class="image-wrapper">
              ${imageHtml}
            </div>
            <div class="name">${escapeHtml(item.name)}</div>
            <span class="category">${escapeHtml(item.category)}</span>
            <div class="color">🎨 ${escapeHtml(item.color)}</div>
            <div class="actions">
              <button class="btn btn-outline btn-sm edit-btn" data-id="${item.id}">✏️</button>
              <button class="btn btn-danger btn-sm delete-btn" data-id="${item.id}">✕</button>
            </div>
          </div>
        `;
      });
      itemsGrid.innerHTML = html;

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm('Удалить вещь?')) {
            deleteItemFromFirebase(id).catch(err => showError('Ошибка удаления: ' + err.message));
          }
        });
      });

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const item = allItems.find(it => it.id === id);
          if (!item) return;
          const newName = prompt('Название:', item.name);
          if (newName === null) return;
          const trimmed = newName.trim();
          if (!trimmed) { alert('Название не может быть пустым'); return; }
          const newCategory = prompt('Категория:', item.category);
          if (newCategory === null) return;
          const newColor = prompt('Цвет:', item.color);
          if (newColor === null) return;
          updateItemInFirebase(id, {
            name: trimmed,
            category: newCategory.trim() || 'Другое',
            color: newColor.trim() || '—'
          }).catch(err => showError('Ошибка обновления: ' + err.message));
        });
      });
    }

    function renderCategories(itemsArray) {
      const cats = new Set();
      itemsArray.forEach(it => cats.add(it.category));
      const sorted = Array.from(cats).sort();
      let html = `<div class="category-pill" data-category="all">🏷️ Все (${itemsArray.length})</div>`;
      sorted.forEach(cat => {
        const count = itemsArray.filter(it => it.category === cat).length;
        html += `<div class="category-pill" data-category="${cat}">${cat} (${count})</div>`;
      });
      categoryContainer.innerHTML = html;

      document.querySelectorAll('.category-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const cat = pill.dataset.category;
          if (cat === 'all') {
            openModal('Все вещи', allItems);
          } else {
            const filtered = allItems.filter(it => it.category === cat);
            openModal(cat, filtered);
          }
        });
      });
    }

    function openModal(title, itemsArray) {
      modalTitle.textContent = title;
      if (!itemsArray.length) {
        modalGrid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#64748b;">В этой категории пока нет вещей</p>`;
      } else {
        let html = '';
        itemsArray.forEach(item => {
          const img = item.imageUrl ?
            `<img src="${item.imageUrl}" alt="${item.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>📷</div>'" />` :
            `<div class="placeholder">📷</div>`;
          html += `
            <div class="item-card">
              <div class="image-wrapper">
                ${img}
              </div>
              <div class="name">${escapeHtml(item.name)}</div>
              <span class="category">${escapeHtml(item.category)}</span>
              <div class="color">🎨 ${escapeHtml(item.color)}</div>
            </div>
          `;
        });
        modalGrid.innerHTML = html;
      }
      modalOverlay.classList.add('open');
    }

    modalCloseBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('open');
    });
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('open');
    });

    async function handleAdd() {
      if (isUploading) return;
      
      const name = document.getElementById('itemName').value.trim();
      const category = document.getElementById('itemCategory').value;
      const color = document.getElementById('itemColor').value;
      const fileInput = document.getElementById('itemImage');
      const file = fileInput.files[0];

      if (!name) { 
        showError('Введите название вещи');
        return; 
      }

      let imageUrl = '';
      if (file) {
        try {
          isUploading = true;
          addBtn.disabled = true;
          uploadIndicator.classList.add('active');
          
          imageUrl = await uploadImage(file);
          console.log('Image uploaded successfully:', imageUrl);
        } catch (err) {
          showError(err.message);
          isUploading = false;
          addBtn.disabled = false;
          uploadIndicator.classList.remove('active');
          return;
        } finally {
          isUploading = false;
          addBtn.disabled = false;
          uploadIndicator.classList.remove('active');
        }
      }

      const newItem = {
        name,
        category,
        color,
        imageUrl: imageUrl || ''
      };

      try {
        await saveItemToFirebase(newItem);
        document.getElementById('itemName').value = '';
        document.getElementById('itemImage').value = '';
      } catch (err) {
        showError('Ошибка сохранения: ' + err.message);
      }
    }

    function clearAll() {
      if (!allItems.length) return;
      if (!confirm('Удалить все вещи из гардероба?')) return;
      const ref = db.ref('wardrobe');
      ref.remove().then(() => {}).catch(err => showError('Ошибка: ' + err.message));
    }

    function exportJSON() {
      if (!allItems.length) { showError('Нет данных для экспорта'); return; }
      const data = allItems.map(({ id, name, category, color, imageUrl }) => ({ id, name, category, color, imageUrl }));
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `wardrobe_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJSON(file) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data) || !data.length) { showError('Невалидный JSON'); return; }
          if (!confirm(`Импортировать ${data.length} вещей?`)) return;
          const ref = db.ref('wardrobe');
          await ref.remove();
          for (const item of data) {
            const { name, category, color, imageUrl } = item;
            if (!name) continue;
            await ref.push({ name, category: category || 'Другое', color: color || '—', imageUrl: imageUrl || '' });
          }
          alert(`Импортировано ${data.length} вещей`);
        } catch (err) { showError('Ошибка импорта: ' + err.message); }
      };
      reader.readAsText(file);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, (m) => map[m]);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFromFirebase();

      addBtn.addEventListener('click', handleAdd);
      
      document.getElementById('itemName').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAdd();
      });

      document.getElementById('clearAllBtn').addEventListener('click', clearAll);
      document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
      document.getElementById('importJsonBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });
      document.getElementById('fileInput').addEventListener('change', (e) => {
        if (e.target.files.length) {
          importJSON(e.target.files[0]);
          e.target.value = '';
        }
      });
    });
  </script>
</body>
</html>
