<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Управление товарами</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">Управление товарами</h2>

    <!-- Добавление товара -->
    <div class="card p-4 shadow-sm mb-4">
      <h4 class="mb-3">Добавить товар</h4>
      <div class="mb-3">
        <label for="name" class="form-label">Название товара</label>
        <input type="text" id="name" class="form-control" placeholder="Например: Oppo Reno 8">
      </div>
      <div class="mb-3">
        <label for="price" class="form-label">Цена (MDL)</label>
        <input type="number" id="price" class="form-control" placeholder="Например: 300">
      </div>
      <button class="btn btn-success w-100" onclick="addProduct()">Добавить товар</button>
    </div>

    <!-- Удаление товара -->
    <div class="card p-4 shadow-sm mb-4">
      <h4 class="mb-3">Удалить товар по ID</h4>
      <div class="mb-3">
        <label for="deleteId" class="form-label">ID товара</label>
        <input type="number" id="deleteId" class="form-control" placeholder="Например: 1697040000000">
      </div>
      <button class="btn btn-danger w-100" onclick="deleteProduct()">Удалить товар</button>
    </div>

    <!-- Уведомление -->
    <div id="status" class="text-center mt-4 fw-bold"></div>

    <!-- Список всех товаров -->
    <div class="card p-4 shadow-sm mt-5">
      <h4 class="mb-3">Все товары в базе</h4>
      <div id="productList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA_WAUmHLsgGKd-0T0w22mjsIh_mkXuOc4",
      authDomain: "isota-ed295.firebaseapp.com",
      databaseURL: "https://isota-ed295-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "isota-ed295",
      storageBucket: "isota-ed295.appspot.com",
      messagingSenderId: "658102298792",
      appId: "1:658102298792:web:fbc90679e3adadcac93a9d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const status = document.getElementById('status');
    const productList = document.getElementById('productList');

    function showMessage(message, success = true) {
      status.textContent = message;
      status.className = `text-center mt-4 fw-bold ${success ? 'text-success' : 'text-danger'}`;
    }

    function addProduct() {
      const name = document.getElementById('name').value.trim();
      const price = parseFloat(document.getElementById('price').value);

      if (!name || isNaN(price)) {
        showMessage("Введите корректные данные", false);
        return;
      }

      const id = Date.now();
      db.ref('products/' + id).set({ id, name, price })
        .then(() => {
          showMessage("✅ Товар успешно добавлен!");
          document.getElementById('name').value = "";
          document.getElementById('price').value = "";
          loadProducts();
        })
        .catch(err => {
          showMessage("❌ Ошибка при добавлении: " + err.message, false);
        });
    }

    function deleteProduct() {
      const id = document.getElementById('deleteId').value.trim();
      if (!id) {
        showMessage("Введите ID товара для удаления", false);
        return;
      }

      db.ref('products/' + id).remove()
        .then(() => {
          showMessage("🗑️ Товар с ID " + id + " удалён");
          document.getElementById('deleteId').value = "";
          loadProducts();
        })
        .catch(err => {
          showMessage("❌ Ошибка при удалении: " + err.message, false);
        });
    }

    function deleteProductById(id) {
      if (confirm(`Удалить товар с ID ${id}?`)) {
        db.ref('products/' + id).remove()
          .then(() => {
            showMessage(`🗑️ Товар с ID ${id} удалён`);
            loadProducts();
          })
          .catch(err => {
            showMessage("❌ Ошибка при удалении: " + err.message, false);
          });
      }
    }

    function loadProducts() {
      db.ref('products').once('value').then(snapshot => {
        const products = snapshot.val();
        productList.innerHTML = '';

        if (!products) {
          productList.innerHTML = '<div class="text-muted">Нет товаров в базе</div>';
          return;
        }

        Object.values(products).forEach(p => {
          const col = document.createElement('div');
          col.className = 'col';

          col.innerHTML = `
            <div class="card h-100 shadow-sm">
              <div class="card-body d-flex flex-column justify-content-between">
                <div>
                  <h5 class="card-title">${p.name}</h5>
                  <p class="card-text text-muted mb-2"><small>ID: ${p.id}</small></p>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-auto">
                  <span class="badge bg-primary">${p.price.toFixed(2)} MDL</span>
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteProductById(${p.id})">Удалить</button>
                </div>
              </div>
            </div>
          `;

          productList.appendChild(col);
        });
      });
    }

    loadProducts();
  </script>
</body>
</html>
