<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SIM-LEX | Дело клиента</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .status-open {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .status-closed {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .modal-content input {
      padding: 10px;
      margin: 10px 0;
      width: 80%;
    }
    .modal-content button {
      margin: 5px;
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="index.html">
      <img src="logo.png" alt="SIM-LEX Logo" class="logo-img" />
    </a>
    <h1>DURA LEX - SED LEX</h1>
  </header>

  <main class="container fade-in">
    <!-- Карточка клиента -->
    <section class="form-card">
      <h2 style="text-align: center; font-weight: bold;">Карточка клиента</h2>
      <p><strong>Статус дела:</strong>
        <button id="status-btn" class="status-open">🔓 Открыто</button>
      </p>
      <p><strong>Номер дела:</strong> <span id="case-title">—</span></p>
      <p><strong>Клиент:</strong> <span id="client-name">—</span></p>
      <p><strong>IDNP:</strong> <span id="client-idnp">—</span></p>
      <p><strong>Телефон:</strong> <span id="client-phone">—</span></p>
      <p><strong>Адрес:</strong> <span id="client-address">—</span></p>
    </section>

    <!-- Добавление услуги -->
    <section class="form-card">
      <h2 style="text-align: center;">Добавить услугу</h2>
      <div class="form-grid">
        <input type="date" id="service-date" />
        <input type="time" id="start-time" />
        <input type="time" id="end-time" />
      </div>
      <textarea id="service-description" placeholder="Описание услуги" rows="4"></textarea>
      <button class="save-btn" onclick="addService()">➕ Добавить в заметки</button>
    </section>

    <!-- Заметки -->
    <section class="form-card">
      <h2>Заметки по делу</h2>
      <div id="service-list" class="fade-in-slow"></div>
      <button onclick="exportToExcel()" class="save-btn">📤 Экспорт в Excel</button>
    </section>

    <!-- Документы -->
    <section class="form-card">
      <h2>📎 Документы</h2>
      <div class="button-group">
        <label class="done-btn upload-btn">
          📎 Выбрать файл
          <input type="file" id="doc-upload" style="display: none;" />
        </label>
        <button onclick="uploadDocument()" class="done-btn save-btn">📤 Загрузить документ</button>
      </div>
      <div id="doc-list"></div>
    </section>
  </main>

  <!-- Модальное окно подтверждения пароля -->
  <div id="password-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>🔐 Подтвердите пароль</h3>
      <input type="password" id="confirm-password" placeholder="Введите пароль" />
      <button onclick="confirmAction()">✅ Подтвердить</button>
      <button onclick="closeModal()">❌ Отмена</button>
    </div>
  </div>

  <script src="firebase.js"></script>
  <script src="case.js"></script>
</body>
</html>
