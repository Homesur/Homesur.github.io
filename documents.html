<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive | Админ-панель документов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 20px 32px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .logo h1 { font-size: 24px; color: white; display: flex; align-items: center; gap: 12px; }
        .logo i { color: #FFD700; font-size: 28px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .drive-status {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #0F9D58, #1E8E3E);
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
        }
        .status-badge {
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .main-folder {
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 60px 40px;
            cursor: pointer;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .main-folder:hover { transform: translateY(-10px); border-color: #FFD700; }
        .main-folder-icon { font-size: 120px; color: #FFD700; margin-bottom: 20px; }
        .main-folder-title { font-size: 42px; font-weight: 800; color: white; margin-bottom: 15px; }
        .main-folder-desc { color: rgba(255,255,255,0.8); font-size: 18px; }
        .breadcrumb {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 14px 28px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .breadcrumb-item {
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 40px;
            background: rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s;
        }
        .breadcrumb-item:hover { background: linear-gradient(135deg, #FFD700, #FFA500); color: #1a1a2e; }
        .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-bottom: 32px; }
        .folder-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 28px 20px;
            cursor: pointer;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s;
        }
        .folder-card:hover { transform: translateY(-10px); background: rgba(255,215,0,0.15); border-color: #FFD700; }
        .folder-card-icon { font-size: 56px; color: #FFD700; margin-bottom: 16px; }
        .folder-card-title { font-size: 18px; font-weight: 600; color: white; }
        .files-table {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            overflow: hidden;
        }
        .files-table-header {
            display: grid;
            grid-template-columns: 50px 1fr 100px 120px 100px;
            background: rgba(0,0,0,0.3);
            padding: 16px 24px;
            font-weight: 700;
            color: #FFD700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .file-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px 120px 100px;
            padding: 16px 24px;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.9);
            transition: all 0.3s;
        }
        .file-row:hover { background: rgba(255,215,0,0.1); }
        .download-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .download-btn:hover { transform: scale(1.05); }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .loading-overlay.active { opacity: 1; visibility: visible; }
        .loader-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top: 4px solid #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px 20px; background: rgba(255,255,255,0.1); border-radius: 24px; color: rgba(255,255,255,0.8); }
        .error-message {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
            border-radius: 16px;
            padding: 20px;
            margin: 20px;
            text-align: center;
            color: #ff8888;
        }
        @media (max-width: 768px) {
            .files-table-header, .file-row { grid-template-columns: 40px 1fr 80px; }
            .files-table-header div:nth-child(4), .file-row div:nth-child(4) { display: none; }
            .main-folder-icon { font-size: 70px; }
            .main-folder-title { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1><i class="fas fa-cloud-upload-alt"></i> Документы</h1></div>
        <div class="drive-status">
            <i class="fab fa-google"></i> 2023-2026

    <div id="loadingOverlay" class="loading-overlay">

    <div id="mainView">
        <div class="main-folder" onclick="loadRootFolder()">

            <div class="main-folder-desc">Нажмите, чтобы открыть хранилище</div>

    <div id="folderView" style="display: none;">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div id="subfoldersGrid" class="folders-grid"></div>
        <div id="filesTableContainer" style="display: none;">
            <div class="files-table">
                <div class="files-table-header">
                    <div></div><div>НАЗВАНИЕ ФАЙЛА</div><div>РАЗМЕР</div><div>ДАТА</div><div></div>
                </div>

            </div>
        </div>
        <div id="emptyFolder" class="empty-state" style="display: none;">📭 Папка пуста</div>
    </div>
</div>

    // Настройки папки:
    const ROOT_FOLDER_ID = "1Obo7qDpfnjUol47QsOIKAysh9YKyJDMr";        // ID папки ("root" = весь Мой диск)

        privateKey: SERVICE_ACCOUNT_CONFIG.private_key,

        rootFolderName: ROOT_FOLDER_NAME,
        accessToken: null,
        tokenExpiry: null
    };

    let currentFolderId = null, currentFolderName = null, historyFolders = [], historyNames = [];

    function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

    function updateStatus(text, isError = false) {
        const badge = document.getElementById('statusBadge');
        if (badge) badge.innerHTML = text;
    }

    // Проверка настроек при загрузке
    function validateConfig() {
        if (!config.clientEmail || config.clientEmail === "ВАШ_EMAIL_СЕРВИСНОГО_АККАУНТА") {
            document.getElementById('mainView').innerHTML = `
                <div class="error-message">
                    <strong>⚠️ Настройки не заполнены!</strong><br><br>
                    Откройте код страницы и вставьте ваши данные в раздел SERVICE_ACCOUNT_CONFIG:<br><br>
                    1. <strong>client_email</strong> — из JSON файла<br>
                    2. <strong>private_key</strong> — из JSON файла (весь блок от BEGIN до END)<br>
                    3. <strong>ROOT_FOLDER_ID</strong> — ID папки или "root"<br>
                </div>
            `;
            updateStatus('❌ ошибка', true);
            return false;
        }
        
        if (!config.privateKey.includes('-----BEGIN PRIVATE KEY-----')) {
            document.getElementById('mainView').innerHTML = `
                <div class="error-message">
                    <strong>⚠️ Неверный формат private_key!</strong><br><br>
                    Убедитесь, что скопировали весь блок от <code>-----BEGIN PRIVATE KEY-----</code><br>
                    до <code>-----END PRIVATE KEY-----</code> включительно.
                </div>
            `;
            updateStatus('❌ ошибка', true);
            return false;
        }
        
        updateStatus('');
        document.getElementById('mainFolderTitle').innerHTML = config.rootFolderName;
        return true;
    }

    function pemToArrayBuffer(pem) {
        let pemContent = pem
            .replace('-----BEGIN PRIVATE KEY-----', '')
            .replace('-----END PRIVATE KEY-----', '')
            .replace(/\s/g, '');
        const binaryString = atob(pemContent);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
        return bytes.buffer;
    }

    async function getAccessToken() {
        if (config.accessToken && config.tokenExpiry && Date.now() < config.tokenExpiry) {
            return config.accessToken;
        }
        
        const header = { alg: 'RS256', typ: 'JWT' };
        const now = Math.floor(Date.now() / 1000);
        const claim = {
            iss: config.clientEmail,
            scope: 'https://www.googleapis.com/auth/drive.readonly',
            aud: 'https://oauth2.googleapis.com/token',
            exp: now + 3600,
            iat: now
        };
        
        function base64UrlEncode(obj) {
            const base64 = btoa(JSON.stringify(obj));
            return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        
        const encodedHeader = base64UrlEncode(header);
        const encodedClaim = base64UrlEncode(claim);
        const signatureInput = encodedHeader + '.' + encodedClaim;
        
        const privateKeyBuffer = pemToArrayBuffer(config.privateKey);
        const cryptoKey = await crypto.subtle.importKey(
            'pkcs8', privateKeyBuffer,
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false, ['sign']
        );
        
        const signature = await crypto.subtle.sign(
            { name: 'RSASSA-PKCS1-v1_5' },
            cryptoKey,
            new TextEncoder().encode(signatureInput)
        );
        
        const signatureBase64 = btoa(String.fromCharCode(...new Uint8Array(signature)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const jwt = signatureInput + '.' + signatureBase64;
        
        const response = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: jwt
            })
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.error_description || 'Ошибка получения токена');
        
        config.accessToken = data.access_token;
        config.tokenExpiry = Date.now() + (data.expires_in * 1000);
        return config.accessToken;
    }

    async function callDriveAPI(endpoint, options = {}) {
        const token = await getAccessToken();
        const response = await fetch(`https://www.googleapis.com/drive/v3/${endpoint}`, {
            ...options,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...options.headers
            }
        });
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error?.message || 'Ошибка API');
        }
        return response;
    }

    async function loadRootFolder() {
        showLoading();
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('folderView').style.display = 'block';
        
        currentFolderId = config.rootFolderId;
        currentFolderName = config.rootFolderName;
        historyFolders = [config.rootFolderId];
        historyNames = [config.rootFolderName];
        
        try {
            await loadCurrentFolder();
        } catch (err) {
            alert('Ошибка: ' + err.message);
        }
        hideLoading();
    }

    async function loadCurrentFolder() {
        const subfoldersGrid = document.getElementById('subfoldersGrid');
        const filesTableContainer = document.getElementById('filesTableContainer');
        const emptyFolder = document.getElementById('emptyFolder');
        
        subfoldersGrid.innerHTML = '';
        filesTableContainer.style.display = 'none';
        emptyFolder.style.display = 'none';
        
        try {
            const query = `'${currentFolderId}' in parents and trashed=false`;
            const response = await callDriveAPI(`files?q=${encodeURIComponent(query)}&orderBy=folder,name&fields=files(id,name,mimeType,size,modifiedTime)`);
            const data = await response.json();
            
            const folders = data.files.filter(f => f.mimeType === 'application/vnd.google-apps.folder');
            const files = data.files.filter(f => f.mimeType !== 'application/vnd.google-apps.folder');
            
            updateBreadcrumb();
            
            if (folders.length > 0) {
                let html = '';
                for (const folder of folders) {
                    html += `<div class="folder-card" onclick="openFolder('${folder.id}', '${escapeHtml(folder.name)}')">
                        <div class="folder-card-icon">📁</div>
                        <div class="folder-card-title">${escapeHtml(folder.name)}</div>
                    </div>`;
                }
                subfoldersGrid.innerHTML = html;
            }
            
            if (files.length > 0) {
                filesTableContainer.style.display = 'block';
                let html = '';
                for (const file of files) {
                    const size = formatSize(file.size);
                    const date = file.modifiedTime ? new Date(file.modifiedTime).toLocaleDateString('ru-RU') : '—';
                    html += `<div class="file-row">
                        <div>${getIcon(file.name)}</div>
                        <div>${escapeHtml(file.name)}</div>
                        <div>${size}</div>
                        <div>${date}</div>
                        <div><button class="download-btn" onclick="downloadFile('${file.id}', '${escapeHtml(file.name)}')">⬇ Скачать</button></div>
                    </div>`;
                }
                document.getElementById('filesList').innerHTML = html;
            }
            
            if (folders.length === 0 && files.length === 0) {
                emptyFolder.style.display = 'block';
            }
        } catch(err) {
            subfoldersGrid.innerHTML = `<div style="text-align:center; color:#ff6b6b; padding:40px;">❌ Ошибка: ${err.message}</div>`;
        }
    }

    async function openFolder(folderId, folderName) {
        showLoading();
        historyFolders.push(folderId);
        historyNames.push(folderName);
        currentFolderId = folderId;
        currentFolderName = folderName;
        await loadCurrentFolder();
        hideLoading();
    }

    async function navigateTo(index) {
        showLoading();
        historyFolders = historyFolders.slice(0, index + 1);
        historyNames = historyNames.slice(0, index + 1);
        currentFolderId = historyFolders[index];
        currentFolderName = historyNames[index];
        await loadCurrentFolder();
        hideLoading();
    }

    async function downloadFile(fileId, fileName) {
        try {
            const response = await callDriveAPI(`files/${fileId}?alt=media`);
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        } catch(err) {
            alert('Ошибка скачивания: ' + err.message);
        }
    }

    function updateBreadcrumb() {
        const breadcrumb = document.getElementById('breadcrumb');
        let html = '<i class="fas fa-map-marker-alt" style="color:#FFD700;"></i> ';
        for (let i = 0; i < historyNames.length; i++) {
            if (i > 0) html += ' <i class="fas fa-chevron-right"></i> ';
            if (i === historyNames.length - 1) {
                html += `<span style="background:#FFD700; color:#1a1a2e; padding:5px 15px; border-radius:30px;">${escapeHtml(historyNames[i])}</span>`;
            } else {
                html += `<span class="breadcrumb-item" onclick="navigateTo(${i})">${escapeHtml(historyNames[i])}</span>`;
            }
        }
        breadcrumb.innerHTML = html;
    }

    function getIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        const icons = { pdf: '📄', doc: '📘', docx: '📘', xls: '📊', xlsx: '📊', jpg: '🖼️', png: '🖼️', zip: '🗜️', txt: '📝' };
        return icons[ext] || '📎';
    }

    function formatSize(bytes) {
        if (!bytes) return '0 Б';
        const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + sizes[i];
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Запуск
    if (validateConfig()) {
        // Всё готово, ждём нажатия на папку
    }
</script>
