<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>База Документов 2023 - 2027 Dropbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 60s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 20px 32px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .logo h1 {
            font-size: 24px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .logo i {
            color: #FFD700;
            font-size: 28px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .dropbox-status {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px #4CAF50;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Главная карточка */
        .main-folder {
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 60px 40px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }

        .main-folder::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }

        .main-folder:hover::before {
            top: -30%;
            left: -30%;
        }

        .main-folder:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 35px 55px rgba(0,0,0,0.3);
            border-color: rgba(255,215,0,0.5);
        }

        .main-folder-icon {
            font-size: 120px;
            color: #FFD700;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            animation: float 4s ease-in-out infinite;
        }

        .main-folder-title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .main-folder-desc {
            color: rgba(255,255,255,0.8);
            font-size: 18px;
        }

        /* Хлебные крошки */
        .breadcrumb {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 14px 28px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .breadcrumb-item {
            cursor: pointer;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 40px;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .breadcrumb-item:hover {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(255,215,0,0.3);
        }

        .breadcrumb-separator {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }

        /* Сетка папок */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .folder-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 28px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            position: relative;
            overflow: hidden;
        }

        .folder-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .folder-card:hover::before {
            left: 100%;
        }

        .folder-card:hover {
            transform: translateY(-10px) rotateX(5deg);
            background: rgba(255,215,0,0.15);
            border-color: rgba(255,215,0,0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .folder-card-icon {
            font-size: 56px;
            color: #FFD700;
            margin-bottom: 16px;
            transition: transform 0.3s;
        }

        .folder-card:hover .folder-card-icon {
            transform: scale(1.1);
        }

        .folder-card-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            word-break: break-word;
        }

        /* Таблица файлов */
        .files-table {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .files-table-header {
            display: grid;
            grid-template-columns: 50px 1fr 100px 120px 100px;
            background: rgba(0,0,0,0.3);
            padding: 16px 24px;
            font-weight: 700;
            color: #FFD700;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .file-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px 120px 100px;
            padding: 16px 24px;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
            color: rgba(255,255,255,0.9);
        }

        .file-row:hover {
            background: rgba(255,215,0,0.1);
            transform: translateX(10px);
        }

        .file-name {
            font-weight: 500;
        }

        .download-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: all 0.3s;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(76,175,80,0.4);
        }

        /* Анимация загрузки */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loader {
            text-align: center;
        }

        .loader-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top: 4px solid #FFD700;
            border-right: 4px solid #FFA500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: white;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .loader-dots {
            display: inline-block;
            width: 60px;
            text-align: left;
        }

        .loader-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .empty-state, .loading {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            color: rgba(255,255,255,0.8);
        }

        /* Адаптив */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .main-folder { padding: 40px 20px; }
            .main-folder-icon { font-size: 70px; }
            .main-folder-title { font-size: 28px; }
            
            .files-table-header, .file-row {
                grid-template-columns: 40px 1fr 80px;
                gap: 10px;
            }
            .files-table-header div:nth-child(4),
            .file-row div:nth-child(4) { display: none; }
            
            .breadcrumb-item { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-cloud-upload-alt"></i> "Home-Lex 2026"</h1>
        </div>
        <div class="dropbox-status">
            <div class="status-dot"></div>
            <span><i class="fab fa-dropbox"></i></span>
        </div>
    </div>

    <!-- Анимация загрузки -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Загрузка<span class="loader-dots"></span></div>
        </div>
    </div>

    <div id="mainView">
        <div class="main-folder" onclick="openDocumentsFolder()">
            <div class="main-folder-icon"><i class="fas fa-folder-open"></i></div>
            <div class="main-folder-title">Документы</div>
            <div class="main-folder-desc"><i class="fas fa-arrow-down"></i> Нажмите, чтобы открыть хранилище</div>
        </div>
    </div>

    <div id="folderView" style="display: none;">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div id="subfoldersGrid" class="folders-grid"></div>
        <div id="filesTableContainer" style="display: none;">
            <div class="files-table">
                <div class="files-table-header">
                    <div><i class="fas fa-file"></i></div>
                    <div>НАЗВАНИЕ ФАЙЛА</div>
                    <div>РАЗМЕР</div>
                    <div>ДАТА</div>
                    <div></div>
                </div>
                <div id="filesList"></div>
            </div>
        </div>
        <div id="emptyFolder" class="empty-state" style="display: none;">
            <i class="fas fa-folder-open" style="font-size: 64px; margin-bottom: 16px;"></i>
            <h3>Папка пуста</h3>
            <p>Загрузите файлы в Dropbox папку</p>
        </div>
    </div>
</div>

<script>
    const DROPBOX_TOKEN = 'sl.u.AGh_mCnkC56CwCBSjm4Kn1MuBmWjBjdtR1JNxx8I2m9dQkQovSFLO4_zCOcFJ2jI6do6-udKRQQ90EStPQurM8GXFKNZOk7AmDVT5txXgkfbZ4ai5rETyHXTcC5cpB72UO3LM3mDzks4EDsxdohZco4DF7z1J0r5wXDOPuN9i-iM_SfjRONbYvMwIFMx8cVmRsUxxBJP3-QeC8oGV0oMIALJaHzFZMnNiPevKZbiW5Kq1KOLcGzoInUoTGoyOl1YODTMBsPKUrx-YMoPkMOJg-GYfFvNDKgUFRyJvM5-k5sqnIWqMJSYmEJ3tugB_RJxhZrCK_j10uoTRtASH7ADvX9mHtbsou_bROKfMe2fs27cD6jawFIvPP3TLWNheUOduFu5AmGSCz8FufZRGew9uQbekETL-FOUSMgSId1cU6zQrBxB5Ah2-QIsCYIMU3lbaKYzJMCEG_gsCHsziVUUyYdsv-JC88XNvV6L4KXrr55b3WyWWRnOtzvE_3wFxS1i4na8NT5jfL8a6O7AB4E508GcDNvTugssx2hO6ZoA27CzNCVKgRdePLbhpahEYL5uf_bC4iPH3aO_g0bVEKzxmSJ5owVTnGinqQMcTEBkm6zqbQpK5Ln89iLxkfb14l4LA0vMZJ4l8zb5l8q7hQVg7934VvNFNlncCNmvnq0nF73I4fxUly8wIIfmCQnAF6MH5Iv8d-sZghIWJjmyssMCaI6n3qaIYIdHdnzsrSfiFisD7uLLWIAhC6nxBU8pdZcAHJyPy-fkyRU3t_3XaSbqQNZkYuiORGOEm4xGXdq0DQF_28StCVyRc2ssH4zRYpLtm7TswV4gpZh_Vj7PSKodC2mGVZyAdTzRQzaT1wAOfk04aSnKDt3N5oH41NNfee9Y1fX3N8uaOzptbVEZEdoaIy9KPirDI9uleFl-hnsVHch4D7z9-11RWpkzuOomcGOTShd4J1YBID2OhcD0wPwCAJrlJ8SptZBcuXKDmHNQSkW5xNY8AOj5WE7-6__2CxQs6t4X3mb-5EGPpyiKzGTBUVZU6CN_7ErOviSZzWuaL4CLAslH-c7FM54z9ys-SNDlntSFRekAIR2MglioPpml1u09Rkoaz_MW9SphBfv9OnyP8otAOQJB-xrUcJ9HXlP1bMvwk4HMgkI7o-RkkJ1N_iMMbz6fButtHOCeurg98ee2XT9eOkxfN1GlapSKq2QwuUOSQYbgwR4kGiKVM8WOaBcgzVzjLo9JSUNo-DywrghmbIdObssB-uL_WZ0l6Sqw4e3L-WRUb7oD3AAskKufipAK';

    let currentPath = '/Documents';
    let currentPathDisplay = 'Documents';
    let historyPaths = ['/Documents'];
    let historyNames = ['Documents'];

    function showLoading() {
        document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    async function callDropboxAPI(endpoint, body) {
        const response = await fetch(`https://api.dropboxapi.com/2/${endpoint}`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${DROPBOX_TOKEN}`,
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(body)
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error_summary || 'Ошибка API');
        }
        return await response.json();
    }

    async function openDocumentsFolder() {
        showLoading();
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('folderView').style.display = 'block';
        
        historyPaths = ['/Documents'];
        historyNames = ['Documents'];
        currentPath = '/Documents';
        currentPathDisplay = 'Documents';
        
        await loadCurrentFolder();
        hideLoading();
    }

    async function loadCurrentFolder() {
        const subfoldersGrid = document.getElementById('subfoldersGrid');
        const filesTableContainer = document.getElementById('filesTableContainer');
        const emptyFolder = document.getElementById('emptyFolder');
        
        subfoldersGrid.innerHTML = '';
        filesTableContainer.style.display = 'none';
        emptyFolder.style.display = 'none';
        
        try {
            const data = await callDropboxAPI('files/list_folder', { path: currentPath });
            const folders = data.entries.filter(item => item['.tag'] === 'folder');
            const files = data.entries.filter(item => item['.tag'] === 'file');
            
            updateBreadcrumb();
            
            if (folders.length > 0) {
                let foldersHtml = '';
                for (const folder of folders) {
                    foldersHtml += `
                        <div class="folder-card" onclick="openSubfolder('${folder.path_lower}', '${escapeHtml(folder.name)}')">
                            <div class="folder-card-icon"><i class="fas fa-folder-open"></i></div>
                            <div class="folder-card-title">${escapeHtml(folder.name)}</div>
                        </div>
                    `;
                }
                subfoldersGrid.innerHTML = foldersHtml;
                document.querySelectorAll('.folder-card').forEach((card, i) => {
                    card.style.animation = `fadeInUp 0.4s ease ${i * 0.05}s both`;
                });
            }
            
            if (files.length > 0) {
                filesTableContainer.style.display = 'block';
                let filesHtml = '';
                
                for (const file of files) {
                    const icon = getFileIcon(file.name);
                    const fileSize = formatFileSize(file.size);
                    const fileDate = file.client_modified ? new Date(file.client_modified).toLocaleDateString('ru-RU') : '—';
                    
                    let downloadUrl = '#';
                    try {
                        const linkData = await callDropboxAPI('files/get_temporary_link', { path: file.path_lower });
                        downloadUrl = linkData.link;
                    } catch(e) {}
                    
                    filesHtml += `
                        <div class="file-row">
                            <div class="file-icon">${icon}</div>
                            <div class="file-name">${escapeHtml(file.name)}</div>
                            <div class="file-size">${fileSize}</div>
                            <div class="file-date">${fileDate}</div>
                            <div><a href="${downloadUrl}" download class="download-btn"><i class="fas fa-download"></i> Скачать</a></div>
                        </div>
                    `;
                }
                document.getElementById('filesList').innerHTML = filesHtml;
            }
            
            if (folders.length === 0 && files.length === 0) {
                emptyFolder.style.display = 'block';
            }
            
        } catch (err) {
            subfoldersGrid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><i class="fas fa-exclamation-triangle"></i><h3>Ошибка</h3><p>${err.message}</p></div>`;
        }
    }

    async function openSubfolder(folderPath, folderName) {
        showLoading();
        historyPaths.push(folderPath);
        historyNames.push(folderName);
        currentPath = folderPath;
        currentPathDisplay = folderName;
        await loadCurrentFolder();
        hideLoading();
    }

    async function navigateToFolder(index) {
        showLoading();
        historyPaths = historyPaths.slice(0, index + 1);
        historyNames = historyNames.slice(0, index + 1);
        currentPath = historyPaths[index];
        currentPathDisplay = historyNames[index];
        await loadCurrentFolder();
        hideLoading();
    }

    function updateBreadcrumb() {
        const breadcrumbDiv = document.getElementById('breadcrumb');
        let html = '<i class="fas fa-map-marker-alt" style="color:#FFD700; margin-right: 8px;"></i>';
        
        for (let i = 0; i < historyNames.length; i++) {
            if (i > 0) {
                html += `<span class="breadcrumb-separator"><i class="fas fa-chevron-right"></i></span>`;
            }
            
            const isLast = (i === historyNames.length - 1);
            if (isLast) {
                html += `<span class="breadcrumb-item" style="background: linear-gradient(135deg, #FFD700, #FFA500); color: #1a1a2e; cursor: default;">${escapeHtml(historyNames[i])}</span>`;
            } else {
                html += `<span class="breadcrumb-item" onclick="navigateToFolder(${i})">${escapeHtml(historyNames[i])}</span>`;
            }
        }
        
        breadcrumbDiv.innerHTML = html;
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        const icons = {
            pdf: '<i class="fas fa-file-pdf" style="color:#f44336"></i>',
            doc: '<i class="fas fa-file-word" style="color:#2196f3"></i>',
            docx: '<i class="fas fa-file-word" style="color:#2196f3"></i>',
            xls: '<i class="fas fa-file-excel" style="color:#4caf50"></i>',
            xlsx: '<i class="fas fa-file-excel" style="color:#4caf50"></i>',
            jpg: '<i class="fas fa-file-image" style="color:#9c27b0"></i>',
            png: '<i class="fas fa-file-image" style="color:#9c27b0"></i>',
            zip: '<i class="fas fa-file-archive" style="color:#795548"></i>',
            rar: '<i class="fas fa-file-archive" style="color:#795548"></i>',
            txt: '<i class="fas fa-file-alt" style="color:#607d8b"></i>'
        };
        return icons[ext] || '<i class="fas fa-file" style="color:#888"></i>';
    }

    function formatFileSize(bytes) {
        if (!bytes) return '0 Б';
        const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + sizes[i];
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
