<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal CRM - Система управления</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- React -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <!-- Export libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a2332;
            --primary-light: #2d3e50;
            --accent: #d4a574;
            --accent-dark: #b8935f;
            --bg: #f8f6f3;
            --card-bg: #ffffff;
            --text: #2c2c2c;
            --text-light: #6b6b6b;
            --border: #e8e4df;
            --success: #5a9f7e;
            --warning: #e6a23c;
            --danger: #c45c5c;
            --info: #4a90e2;
            --shadow: rgba(26, 35, 50, 0.08);
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 2rem 3rem;
            box-shadow: 0 4px 20px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.disconnected {
            background: var(--danger);
            animation: none;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 2rem;
            overflow-y: auto;
            box-shadow: 4px 0 20px var(--shadow);
        }

        .nav-section {
            margin-bottom: 2rem;
        }

        .nav-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .nav-btn {
            width: 100%;
            padding: 1rem 1.25rem;
            margin-bottom: 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 400;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-btn:hover {
            background: var(--bg);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(26, 35, 50, 0.2);
        }

        .nav-btn .icon {
            font-size: 1.25rem;
        }

        
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
        }

        .content-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
        }

        .search-box {
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            width: 300px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        /* Calendar */
        .calendar-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .calendar-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .calendar-nav {
            display: flex;
            gap: 0.5rem;
        }

        .calendar-nav button {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calendar-nav button:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .calendar-day-header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calendar-day {
            background: var(--card-bg);
            min-height: 120px;
            padding: 0.75rem;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calendar-day:hover {
            background: var(--bg);
        }

        .calendar-day.other-month {
            opacity: 0.4;
        }

        .calendar-day.today {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, rgba(212, 165, 116, 0.05) 100%);
        }

        .day-number {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .calendar-day.today .day-number {
            background: var(--accent);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .event-item {
            background: var(--accent);
            color: white;
            padding: 0.35rem 0.5rem;
            margin-bottom: 0.25rem;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event-item:hover {
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(212, 165, 116, 0.4);
        }

        .event-item.status-new {
            background: var(--success);
        }

        .event-item.status-in-progress {
            background: var(--warning);
        }

        .event-item.status-completed {
            background: var(--text-light);
        }

        /* Client List */
        .client-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .client-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
        }

        .client-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(26, 35, 50, 0.15);
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .client-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .client-phone {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .client-status {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-active {
            background: rgba(90, 159, 126, 0.15);
            color: var(--success);
        }

        .status-pending {
            background: rgba(230, 162, 60, 0.15);
            color: var(--warning);
        }

        .client-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .info-row .label {
            font-weight: 600;
            color: var(--text);
        }

        /* Client Detail View */
        .client-detail {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .client-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .back-btn {
            padding: 0.75rem 1.5rem;
            background: var(--text-light);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .back-btn:hover {
            background: var(--text);
            transform: translateY(-2px);
        }

        .client-actions {
            display: flex;
            gap: 1rem;
        }

        .action-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .action-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .action-card .icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .action-card .title {
            font-weight: 600;
            color: var(--primary);
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 1rem 1.5rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--accent);
        }

        .tab:hover {
            color: var(--primary);
        }

        /* Tasks & Cases List */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .list-item {
            background: var(--bg);
            border-radius: 8px;
            padding: 1.5rem;
            border-left: 4px solid var(--accent);
            transition: all 0.3s ease;
        }

        .list-item:hover {
            box-shadow: 0 4px 12px var(--shadow);
        }

        .list-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .list-item-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .list-item-status {
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.list-item-status.status-new {
    background: rgba(230, 162, 60, 0.15);
    color: var(--warning);
}

.list-item-status.status-in-progress {
    background: rgba(74, 144, 226, 0.15);
    color: var(--info);
}

.list-item-status.status-completed {
    background: rgba(90, 159, 126, 0.15);
    color: var(--success);
}

        .list-item-content {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .list-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 35, 50, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(26, 35, 50, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Source Sans Pro', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 165, 116, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #a94442;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px var(--shadow);
            border-left: 4px solid var(--accent);
        }

        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--text-light);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .loading-spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dark);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow);
            animation: slideInRight 0.3s ease;
            z-index: 2000;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.error {
            background: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Firebase Configuration Component
        function FirebaseConfig() {
            const [config, setConfig] = useState({
                apiKey: '',
                authDomain: '',
                databaseURL: '',
                projectId: '',
                storageBucket: '',
                messagingSenderId: '',
                appId: ''
            });
            const [showConfig, setShowConfig] = useState(false);

            useEffect(() => {
                const savedConfig = localStorage.getItem('firebaseConfig');
                if (savedConfig) {
                    try {
                        setConfig(JSON.parse(savedConfig));
                    } catch (e) {
                        console.error('Failed to parse config:', e);
                    }
                } else {
                    setShowConfig(true);
                }
            }, []);

            const saveConfig = () => {
                localStorage.setItem('firebaseConfig', JSON.stringify(config));
                setShowConfig(false);
                window.location.reload();
            };

            if (!showConfig && config.apiKey) {
                return null;
            }

            return (
                <div className="modal-overlay">
                    <div className="modal">
                        <h3>Настройка Firebase</h3>
                        <p style={{marginBottom: '1.5rem', color: 'var(--text-light)'}}>
                            Введите данные вашего Firebase проекта
                        </p>
                        
                        <div className="form-group">
                            <label>API Key *</label>
                            <input
                                type="text"
                                value={config.apiKey}
                                onChange={(e) => setConfig({...config, apiKey: e.target.value})}
                            />
                        </div>
                        <div className="form-group">
                            <label>Auth Domain *</label>
                            <input
                                type="text"
                                value={config.authDomain}
                                onChange={(e) => setConfig({...config, authDomain: e.target.value})}
                            />
                        </div>
                        <div className="form-group">
                            <label>Database URL *</label>
                            <input
                                type="text"
                                value={config.databaseURL}
                                onChange={(e) => setConfig({...config, databaseURL: e.target.value})}
                                placeholder="https://your-project.firebaseio.com"
                            />
                        </div>
                        <div className="form-group">
                            <label>Project ID *</label>
                            <input
                                type="text"
                                value={config.projectId}
                                onChange={(e) => setConfig({...config, projectId: e.target.value})}
                            />
                        </div>
                        <div className="form-group">
                            <label>Storage Bucket</label>
                            <input
                                type="text"
                                value={config.storageBucket}

        // Main App Component
        function App() {
            const [database, setDatabase] = useState(null);
            const [connected, setConnected] = useState(false);
            const [activeView, setActiveView] = useState('calendar');
            const [selectedClient, setSelectedClient] = useState(null);
            const [clients, setClients] = useState({});
            const [cases, setCases] = useState({});
            const [events, setEvents] = useState({});
            const [tasks, setTasks] = useState({});
            const [activityLog, setActivityLog] = useState({});
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState('');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [searchTerm, setSearchTerm] = useState('');
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);

            // Initialize Firebase
            useEffect(() => {
                const configStr = localStorage.getItem('firebaseConfig');
                if (!configStr) {
                    setLoading(false);
                    return;
                }

                try {
                    const config = JSON.parse(configStr);
                    
                    if (!firebase.apps.length) {
                        firebase.initializeApp(config);
                    }
                    
                    const db = firebase.database();
                    setDatabase(db);

                    const connectedRef = db.ref('.info/connected');
                    connectedRef.on('value', (snap) => {
                        setConnected(snap.val() === true);
                    });

                    db.ref('clients').on('value', (snapshot) => {
                        setClients(snapshot.val() || {});
                    });

                    db.ref('cases').on('value', (snapshot) => {
                        setCases(snapshot.val() || {});
                    });

                    db.ref('events').on('value', (snapshot) => {
    setEvents(snapshot.val() || {});
});

                    db.ref('tasks').on('value', (snapshot) => {
                        setTasks(snapshot.val() || {});
                    });

                    db.ref('activityLog').limitToLast(50).on('value', (snapshot) => {
                        setActivityLog(snapshot.val() || {});
                    });

                    setLoading(false);
                } catch (error) {
                    console.error('Firebase initialization error:', error);
                    showToast('Ошибка подключения к Firebase', 'error');
                    setLoading(false);
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const logActivity = (action, details) => {
                if (!database) return;
                
                const logEntry = {
                    action,
                    details,
                    timestamp: Date.now(),
                    date: new Date().toISOString()
                };

                database.ref('activityLog').push(logEntry);
            };

            const addClient = (clientData) => {
                if (!database) return;

                console.log('Saving client with status:', clientData.status); // <- ДОБАВЬТЕ ЭТО
				const newClientRef = database.ref('clients').push();
                newClientRef.set({
                    ...clientData,
                    id: newClientRef.key,
                    createdAt: Date.now()
                }).then(() => {
                    logActivity('Добавлен клиент', `${clientData.name}`);
                    showToast('Клиент успешно добавлен');
                }).catch((error) => {
                    console.error('Error adding client:', error);
                    showToast('Ошибка при добавлении клиента', 'error');
                });
            };

            const deleteClient = (clientId, clientName) => {
                if (!database) return;
                if (!confirm(`Удалить клиента "${clientName}"? Все связанные дела, события и задачи также будут удалены.`)) return;

                // Delete client and all related data
                const updates = {};
                updates[`clients/${clientId}`] = null;
                
                // Delete related cases
                Object.entries(cases).forEach(([caseId, caseData]) => {
                    if (caseData.clientId === clientId) {
                        updates[`cases/${caseId}`] = null;
                    }
                });

                // Delete related events
                Object.entries(events).forEach(([eventId, eventData]) => {
                    if (eventData.clientId === clientId) {
                        updates[`events/${eventId}`] = null;
                    }
                });

                // Delete related tasks
                Object.entries(tasks).forEach(([taskId, taskData]) => {
                    if (taskData.clientId === clientId) {
                        updates[`tasks/${taskId}`] = null;
                    }
                });

                database.ref().update(updates)
                    .then(() => {
                        logActivity('Удален клиент', clientName);
                        showToast('Клиент и все связанные данные удалены');
                        setSelectedClient(null);
                    })
                    .catch((error) => {
                        console.error('Error deleting client:', error);
                        showToast('Ошибка при удалении', 'error');
                    });
            };

            const addCase = (caseData) => {
    if (!database || !selectedClient) return;

    database.ref('cases').once('value', (snapshot) => {
        const existingCases = snapshot.val() || {};
        
        let maxNumber = 0;
        Object.values(existingCases).forEach(c => {
            if (c.caseNumber) {
                maxNumber = Math.max(maxNumber, c.caseNumber);
            }
        });
        
        const newCaseNumber = maxNumber + 1;
        const caseTitle = `Dosar nr. ${String(newCaseNumber).padStart(5, '0')}`;
        
        const newCaseRef = database.ref('cases').push();
        newCaseRef.set({
            ...caseData,
            id: newCaseRef.key,
            caseNumber: newCaseNumber,
            title: caseTitle,
            paymentStatus: caseData.paymentStatus || 'Не оплачено',  // <- ДОБАВЬТЕ ЭТУ СТРОКУ
            clientId: selectedClient.id,
            clientName: selectedClient.name,
            createdAt: Date.now()
        }).then(() => {
            logActivity('Добавлено дело', `${caseTitle} для ${selectedClient.name}`);
            showToast('Дело успешно добавлено');
        }).catch((error) => {
            console.error('Error adding case:', error);
            showToast('Ошибка при добавлении дела', 'error');
        });
    });
};

const updateCase = (caseId, updates) => {
    if (!database) return;

    // Фильтруем undefined значения
    const cleanUpdates = {};
    Object.keys(updates).forEach(key => {
        if (updates[key] !== undefined) {
            cleanUpdates[key] = updates[key];
        }
    });

    database.ref(`cases/${caseId}`).update(cleanUpdates)
        .then(() => {
            logActivity('Обновлено дело', 'Дело обновлено');
            showToast('Дело обновлено');
        })
        .catch((error) => {
            console.error('Error updating case:', error);
            showToast('Ошибка при обновлении дела', 'error');
        });
};

const deleteCase = (caseId, caseTitle) => {
    if (!database) return;
    if (!confirm(`Удалить дело "${caseTitle}"? Все связанные события также будут удалены.`)) return;

    const updates = {};
    updates[`cases/${caseId}`] = null;
    
    // Удаляем связанные события
    Object.entries(events).forEach(([eventId, eventData]) => {
        if (eventData.caseId === caseId) {

        }
    });

    database.ref().update(updates)
        .then(() => {
            logActivity('Удалено дело', caseTitle);
            showToast('Дело и связанные события удалены');
        })
        .catch((error) => {
            console.error('Error deleting case:', error);
            showToast('Ошибка при удалении', 'error');
        });
};

const updateEvent = (eventId, updates) => {
    if (!database) return;

    // Фильтруем undefined значения
    const cleanUpdates = {};
    Object.keys(updates).forEach(key => {
        if (updates[key] !== undefined) {
            cleanUpdates[key] = updates[key];
        }
    });

    database.ref(`events/${eventId}`).update(cleanUpdates)
        .then(() => {
            logActivity('Обновлено событие', 'Событие обновлено');
            showToast('Событие обновлено');

        })
        .catch((error) => {

};

const deleteEvent = (eventId, eventTitle) => {

            const exportToPDF = () => {

                if (clientsArray.length > 0) {

                    doc.autoTable({

                        head: [['ФИО', 'Телефон', 'Email', 'Статус']],

                    });
                }

                if (casesArray.length > 0) {

                    doc.setFontSize(14);

                        startY: finalY + 20,

                    });

                logActivity('Экспорт данных', 'Экспорт в PDF');

            const openModal = (type) => {
    setModalType(type);
    setShowModal(true);
};

            if (loading) {
                return (
                    <div className="loading">
                        <div className="loading-spinner"></div>
                        <p>Подключение к базе данных...</p>
                    </div>
                );
            }

            const clientsArray = Object.values(clients);
            const casesArray = Object.values(cases);

            const tasksArray = Object.values(tasks);

            return (
                <>
                    <FirebaseConfig />
                    <div className="app-container">
                        <header className="header">
                            <div className="header-content">
                                <div>
                                    <h1>⚖️ Legal CRM</h1>
                                    <p>Система управления юридической практикой</p>
                                </div>
                                <div className="connection-status">

                                    >

                                    <button

                                        onClick={() => {

                                    >
                                        <span className="icon">📅</span>

                                    <button

                                    >
                                        <span className="icon">💰</span>

                                        <span className="icon">➕</span>
                                        Добавить клиента
                                    </button>
                                </div>

                                <div className="nav-section">
                                    <h3>Статистика</h3>
                                    <div style={{padding: '1rem', background: 'var(--bg)', borderRadius: '8px'}}>
                                        <div style={{marginBottom: '0.75rem'}}>
                                            <strong>{clientsArray.length}</strong> клиентов
                                        </div>
                                        <div style={{marginBottom: '0.75rem'}}>
                                            <strong>{casesArray.length}</strong> дел

    />
)}

                        {toast && (

        function ClientDetailView({ client, cases, events, tasks, onBack, onAddCase, onAddEvent, onAddTask, onToggleTask, onUpdateClient, onUpdateCase, onUpdateEvent, onDeleteEvent, onDeleteCase, onDeleteClient }) {
            const [activeTab, setActiveTab] = useState('cases');
const [editMode, setEditMode] = useState(false);
const [editData, setEditData] = useState(client);
const [editingCase, setEditingCase] = useState(null);
const [editCaseData, setEditCaseData] = useState({});
const [editingEvent, setEditingEvent] = useState(null);
const [editEventData, setEditEventData] = useState({});
const [selectedCaseForEvents, setSelectedCaseForEvents] = useState(null);

const exportClientToExcel = (client, cases, events, tasks) => {

const handleFileUpload = (e) => {
    const selectedFiles = Array.from(e.target.files);
    setUploading(true);
    
    selectedFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const fileData = {
                id: Date.now() + Math.random(),
                name: file.name,
                size: file.size,
                type: file.type,
                data: event.target.result,
                uploadedAt: Date.now()
            };
            
            // Сохраняем в localStorage (для демо)
            const existingFiles = JSON.parse(localStorage.getItem(`files_${client.id}`) || '[]');
            existingFiles.push(fileData);
            localStorage.setItem(`files_${client.id}`, JSON.stringify(existingFiles));
            
            setFiles(existingFiles);
            showToast(`Файл ${file.name} загружен`);
        };
        reader.readAsDataURL(file);
    });
    
    setUploading(false);
    e.target.value = '';
};

const deleteFile = (fileId, fileName) => {
    if (!confirm(`Удалить файл "${fileName}"?`)) return;
    
    const existingFiles = JSON.parse(localStorage.getItem(`files_${client.id}`) || '[]');
    const updatedFiles = existingFiles.filter(f => f.id !== fileId);
    localStorage.setItem(`files_${client.id}`, JSON.stringify(updatedFiles));
    
    setFiles(updatedFiles);
    showToast('Файл удалён');
};

        function CalendarView({ events, currentDate, setCurrentDate }) {
    const [selectedDay, setSelectedDay] = React.useState(null);
    const [showDayModal, setShowDayModal] = React.useState(false);
    
    const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                      'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

                const days = [];
                
                const prevMonthDays = new Date(year, month, 0).getDate();
                for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                    days.push({
                        date: new Date(year, month - 1, prevMonthDays - i),
                        isCurrentMonth: false
                    });
                }

                for (let i = 1; i <= daysInMonth; i++) {
                    days.push({
                        date: new Date(year, month, i),
                        isCurrentMonth: true
                    });
                }

                const remainingDays = 42 - days.length;
                for (let i = 1; i <= remainingDays; i++) {
                    days.push({
                        date: new Date(year, month + 1, i),
                        isCurrentMonth: false
                    });
                }

                return days;
            };

            const getEventsForDay = (date) => {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const dateStr = `${year}-${month}-${day}`;
    return events.filter(event => event.date === dateStr);
};

                const today = new Date();

                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1));
            };

                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1));
            };

                if (dayEvents.length > 0) {
                    setSelectedDay({ date, events: dayEvents });
                    setShowDayModal(true);
                }
            };

            const days = getDaysInMonth(currentDate);

            return (
                <>
                    <div className="content-header">

                    </div>

                    <div className="calendar-container">
                        <div className="calendar-header">
                            <h3>{monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}</h3>
                            <div className="calendar-nav">
                                <button onClick={prevMonth}>← Назад</button>
                                <button onClick={() => setCurrentDate(new Date())}>Сегодня</button>
                                <button onClick={nextMonth}>Вперёд →</button>
                            </div>
                        </div>

                        <div className="calendar-grid">
                            {daysOfWeek.map(day => (
                                <div key={day} className="calendar-day-header">
                                    {day}
                                </div>
                            ))}
                            {days.map((day, index) => {
                                const dayEvents = getEventsForDay(day.date);
                                return (
                                    <div
                                        key={index}
                                        className={`calendar-day ${!day.isCurrentMonth ? 'other-month' : ''} ${isToday(day.date) ? 'today' : ''}`}
                                        onClick={() => handleDayClick(day.date, dayEvents)}
                                        style={{cursor: dayEvents.length > 0 ? 'pointer' : 'default'}}
                                    >
                                        <div className="day-number">{day.date.getDate()}</div>
                                        {dayEvents.map(event => (
                                            <div 
                                                key={event.id} 
                                                className={`event-item status-${event.status || 'new'}`}
                                            >
                                                {event.title}

                                        ))}
                                    </div>
                                );
                            })}
                        </div>

                    {showDayModal && selectedDay && (
                        <div className="modal-overlay" onClick={() => setShowDayModal(false)}>

eventsArray.filter(e => e.isPaid).forEach(e => {

                    </select>
                </div>
                {formData.isPaid && (
                    <>
                        <div className="form-group">
                            <label>Сумма за событие (MDL)</label>
                            <input
                                type="number"
                                value={formData.eventAmount || ''}
                                onChange={(e) => handleChange('eventAmount', e.target.value)}
                                placeholder="0"
                            />
                        </div>
                        <div className="form-group">
                            <label>Статус оплаты</label>
                            <select
                                value={formData.paymentStatus || 'Не оплачено'}
                                onChange={(e) => handleChange('paymentStatus', e.target.value)}
                            >
                                <option>Не оплачено</option>
                                <option>Оплачено</option>
                            </select>
                        </div>
                    </>
                )}
                <div className="form-group">
                    <label>Статус</label>
                    <select
                        value={formData.status || 'new'}
                        onChange={(e) => handleChange('status', e.target.value)}
                    >
                        <option value="new">Новое</option>
                        <option value="in-progress">В процессе</option>
                        <option value="completed">Завершено</option>
                    </select>
                </div>
                <div className="form-group">
                    <label>Описание</label>
                    <textarea
                        value={formData.description || ''}
                        onChange={(e) => handleChange('description', e.target.value)}
                    />
                </div>
                <div className="form-actions">
                    <button type="button" className="btn btn-secondary" onClick={onClose}>
                        Отмена
                    </button>
                    <button type="submit" className="btn btn-primary">
                        Сохранить
                    </button>
                </div>
            </form>
        </>
    );

                    case 'task':
                        return (
                            <>
                                <h3>Добавить напоминание</h3>
                                <form onSubmit={handleSubmit}>
                                    <div className="form-group">
                                        <label>Название напоминания *</label>
                                        <input
                                            type="text"
                                            required
                                            value={formData.title || ''}
                                            onChange={(e) => handleChange('title', e.target.value)}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Описание</label>
                                        <textarea
                                            value={formData.description || ''}
                                            onChange={(e) => handleChange('description', e.target.value)}
                                        />
                                    </div>
                                    <div className="form-actions">
                                        <button type="button" className="btn btn-secondary" onClick={onClose}>
                                            Отмена
                                        </button>
                                        <button type="submit" className="btn btn-primary">
                                            Сохранить
                                        </button>
                                    </div>
                                </form>
                            </>
                        );
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        {renderForm()}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
