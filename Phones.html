<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Phones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f9;
      color: #333;
    }
    header {
      background: #1e3a8a;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .container {
      padding: 15px;
      max-width: 700px;
      margin: auto;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 15px;
      margin-bottom: 20px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #1e3a8a;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #1e3a8a;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #2563eb; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-grid-full {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .result {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }
    .phone-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .phone-header { font-weight: bold; font-size: 16px; color: #1e3a8a; }
    .phone-detail { font-size: 14px; color: #444; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      width: auto;
      max-width: fit-content;
    }
    .status-work { background: crimson; }
    .status-ready { background: blue; }
    .status-issued { background: green; }
  </style>
</head>
<body>
  <header>Учет заказов по ремонту Цифравых гаджетов! 2026г</header>

  <div class="container">
    <div class="card">
      <h2>Добавить телефон</h2>
      
      <!-- Строка 1: Клиент и Новый клиент -->
      <div class="form-grid">
        <select id="clientSelect">
          <option value="">-- Выберите клиента --</option>
          <option value="Анатолий (Рынок)">Анатолий (Рынок)</option>
		  <option value="Андрей (Патрия)">Андрей (Патрия)</option>
          <option value="Джордан">Джордан</option>
          <option value="Двацуня">Двацуня</option>
          <option value="SPM-Godok">SPM-Godok</option>
          <option value="Эльдар">Эльдар</option>
          <option value="Женя (Рынок)">Женя (Рынок)</option>
          <option value="Валя (Рынок)">Валя (Рынок)</option>
          <option value="Миша (Рынок)">Миша (Рынок)</option>
          <option value="Миша Мотрук">Миша Мотрук</option>
		  <option value="Роман Иваныч">Роман Иваныч</option>
          <option value="Рустам">Рустам</option>
        </select>
        <input id="clientName" placeholder="Новый клиент (если нет в списке)">
      </div>

      <!-- Строка 2: Номер телефона и Адрес -->
      <div class="form-grid">
        <input id="phoneNumber" placeholder="📱 Номер телефона">
        <input id="address" placeholder="📍 Адрес клиента">
      </div>

      <!-- Строка 3: Марка и Модель -->
      <div class="form-grid">
        <select id="brandSelect">
          <option value="">-- Выберите марку --</option>
          <option value="Apple">Apple</option>
          <option value="Samsung">Samsung</option>
          <option value="Xiaomi">Xiaomi</option>
          <option value="Huawei">Huawei</option>
          <option value="Oppo">Oppo</option>
          <option value="Realme">Realme</option>
          <option value="Nokia">Nokia</option>
          <option value="Sony">Sony</option>
          <option value="Motorola">Motorola</option>
          <option value="LG">LG</option>
          <option value="Google">Google (Pixel)</option>
        </select>
        <input id="phoneModel" placeholder="Модель телефона">
      </div>

      <!-- Строка 4: Неисправность -->
      <div class="form-grid-full">
        <select id="issue">
          <option value="Не включается">Не включается</option>
          <option value="Не заряжается">Не заряжается</option>
          <option value="Разбит экран">Разбит экран</option>
          <option value="Прошивка">Прошивка</option>
          <option value="Не работает звук">Не работает звук</option>
          <option value="Не ловит сеть">Не ловит сеть</option>
          <option value="Нет изображения">Нет изображения</option>
          <option value="Не работает сенсор">Не работает сенсор</option>
		  <option value="Замена стекла">Замена стекла</option>
          <option value="Замена аккумулятора">Замена аккумулятора</option>
          <option value="Забыли пароль">Забыли пароль</option>
          <option value="Google account">Google account</option>
          <option value="Mi account">Mi account</option>
          <option value="Другое">Другое...</option>
        </select>
      </div>

      <button onclick="addPhone()">Сохранить</button>
    </div>

    <div class="card">
      <h2>Поиск</h2>
      <input id="searchQuery" placeholder="Поиск по номеру, клиенту или модели">
      <button onclick="searchPhone()">Найти</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmEjyAgQDS2kT8jcwi9LegqN0DZcqHFwk",
      authDomain: "database-well-tell.firebaseapp.com",
      databaseURL: "https://database-well-tell-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "database-well-tell",
      storageBucket: "database-well-tell.firebasestorage.app",
      messagingSenderId: "964122450648",
      appId: "1:964122450648:web:990bd957b86595b48815ad"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function addPhone() {
      const clientSelect = document.getElementById("clientSelect").value;
      const clientName = document.getElementById("clientName").value.trim();
      const phoneNumber = document.getElementById("phoneNumber").value.trim();
      const address = document.getElementById("address").value.trim();
      const brand = document.getElementById("brandSelect").value;
      const phoneModel = document.getElementById("phoneModel").value.trim();
      let issue = document.getElementById("issue").value;

      if (issue === "Другое") {
        issue = prompt("Введите причину неисправности:");
        if (!issue) return;
      }

      const client = clientName || clientSelect;
      if (!client) {
        alert("Укажите клиента!");
        return;
      }

      if (!phoneNumber) {
        alert("Введите номер телефона клиента!");
        return;
      }

      const receivedAt = new Date().toISOString();

      try {
        const newRef = push(ref(db, 'phones'));
        await set(newRef, {
          client,
          phoneNumber,
          address,
          brand,
          phoneModel,
          issue,
          status: "В работе",
          services: [],
          price: null,
          receivedAt,
          issuedAt: null,
          supplier: null
        });
        alert("Телефон добавлен!");
        
        // Очистка полей
        document.getElementById("clientSelect").value = "";
        document.getElementById("clientName").value = "";
        document.getElementById("phoneNumber").value = "";
        document.getElementById("address").value = "";
        document.getElementById("brandSelect").value = "";
        document.getElementById("phoneModel").value = "";
        document.getElementById("issue").value = "Не включается";
      } catch (error) {
        console.error("Ошибка добавления:", error);
        alert("Ошибка при добавлении: " + error.message);
      }
    }

    async function searchPhone() {
      const q = document.getElementById("searchQuery").value.toLowerCase().trim();

      if (!q) {
        document.getElementById("result").innerHTML = "<p>Введите запрос для поиска</p>";
        return;
      }

      try {
        const phonesRef = ref(db, 'phones');
        const snap = await get(phonesRef);
        
        let resultHTML = "";

        if (snap.exists()) {
          snap.forEach(child => {
            const data = child.val();
            const fullModel = `${data.brand || ""} ${data.phoneModel || ""}`.toLowerCase();

            if (
              (data.client && data.client.toLowerCase().includes(q)) ||
              (data.phoneNumber && data.phoneNumber.toLowerCase().includes(q)) ||
              (data.phoneModel && data.phoneModel.toLowerCase().includes(q)) ||
              (data.address && data.address.toLowerCase().includes(q)) ||
              fullModel.includes(q)
            ) {
              let badgeClass = "status-work";
              if (data.status === "Готов") badgeClass = "status-ready";
              else if (data.status === "Выдан клиенту") badgeClass = "status-issued";
              else if (data.status === "Выдан в долг!") badgeClass = "status-work";

              resultHTML += `
                <div class="phone-card">
                  <div class="phone-header">${data.brand || ""} ${data.phoneModel || ""}</div>
                  <div class="phone-detail">👤 Клиент: ${data.client || "-"} ${data.phoneNumber ? `(${data.phoneNumber})` : ""}</div>
                  ${data.address ? `<div class="phone-detail">📍 Адрес: ${data.address}</div>` : ""}
                  <div class="phone-detail">📅 Дата приёма: ${data.receivedAt ? new Date(data.receivedAt).toLocaleDateString() : "-"}</div>
                  <div class="phone-detail">⚡ Неисправность: ${data.issue}</div>
                  <div class="phone-detail">💰 Цена: ${data.price || "-"}</div>
              `;

              if (
                ["Готов", "Выдан клиенту", "Выдан в долг!"].includes(data.status) &&
                data.services &&
                data.services.length > 0
              ) {
                resultHTML += `<div class="phone-detail">🛠 Услуга: ${data.services.join(", ")}</div>`;
              }

              if (data.issuedAt) {
                resultHTML += `<div class="phone-detail">✅ Дата выдачи: ${new Date(data.issuedAt).toLocaleDateString()}</div>`;
              }

              resultHTML += `<span class="badge ${badgeClass}">${data.status}</span></div>`;
            }
          });
        }

        document.getElementById("result").innerHTML = resultHTML || "<p>Ничего не найдено</p>";
      } catch (error) {
        console.error("Ошибка поиска:", error);
        document.getElementById("result").innerHTML = "<p>Ошибка при поиске: " + error.message + "</p>";
      }
    }

    window.addPhone = addPhone;
    window.searchPhone = searchPhone;
  </script>
</body>
</html>
