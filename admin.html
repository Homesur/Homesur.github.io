<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админка вопросов</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    .category-card {
      background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border-radius: 10px;
      border: none;
    }
    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    .category-card .icon {
      font-size: 24px;
      color: #00796b;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">Добавление вопросов</h2>

    <!-- Форма добавления -->
    <div class="card p-4 shadow-sm mb-4">
      <h5 class="mb-3">Новый вопрос</h5>
      <div class="mb-3">
        <label for="categoryInput" class="form-label">Категория</label>
        <select id="categoryInput" class="form-select">
          <option value="">-- Выберите категорию --</option>
          <option value="Ю.Плешка">Ю.Плешка</option>
          <option value="Бойко.А">Бойко.А</option>
          <option value="Тома.С">Тома.С</option>
		  <option value="Бубулич.В">Бубулич.В</option>
		  <option value="Чекырлан">Чекырлан</option>
		  <option value="По оплате">По оплате</option>
		  <option value="По договору">По договору</option>
		  <option value="Ионица.Ю">Ионица.Ю</option>
		  <option value="Общие">Общие</option>
          <option value="Ув.Суд">Ув.Суд</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="questionInput" class="form-label">Вопрос</label>
        <textarea id="questionInput" class="form-control" placeholder="Введите вопрос"></textarea>
      </div>
      <button class="btn btn-success w-100" onclick="addQuestion()">Сохранить вопрос</button>
    </div>

    <!-- Категории -->
    <div class="mb-4">
      <h5 class="mb-3">Категории</h5>
      <div id="categoryCards" class="row g-3"></div>
    </div>

    <!-- Вопросы выбранной категории -->
    <div class="card p-4 shadow-sm">
      <h5>Вопросы категории: <span id="selectedCategory" class="text-primary"></span></h5>
      <ul id="questionList" class="list-group mt-3"></ul>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBbxvDq2ScstW7vlYHj_qRoay1ed1YaQHI",
      authDomain: "judecatoria-1e6f6.firebaseapp.com",
      databaseURL: "https://judecatoria-1e6f6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "judecatoria-1e6f6",
      storageBucket: "judecatoria-1e6f6.appspot.com",
      messagingSenderId: "130607746443",
      appId: "1:130607746443:web:bb04d8608d644e404a738e",
      measurementId: "G-01LNNN548P"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function addQuestion() {
      const category = document.getElementById('categoryInput').value.trim();
      const question = document.getElementById('questionInput').value.trim();
      if (!category || !question) return;

      const id = Date.now();
      db.ref('questions/' + id).set({ id, category, question })
        .then(() => {
          document.getElementById('categoryInput').value = "";
          document.getElementById('questionInput').value = "";
          loadCategories();
        })
        .catch(err => alert("Ошибка: " + err.message));
    }

    function loadCategories() {
      db.ref('questions').once('value').then(snapshot => {
        const data = snapshot.val();
        const categories = new Set(["Ю.Плешка", "Бойко.А", "Тома.С", "Ув.Суд"]);
        for (let key in data) {
          categories.add(data[key].category);
        }

        const container = document.getElementById('categoryCards');
        container.innerHTML = '';
        categories.forEach(cat => {
          const col = document.createElement('div');
          col.className = 'col-md-3';
          col.innerHTML = `
            <div class="card h-100 shadow-sm category-card" onclick="showQuestions('${cat}')">
              <div class="card-body text-center">
                <div class="icon mb-2">📁</div>
                <h6 class="card-title fw-bold">${cat}</h6>
              </div>
            </div>
          `;
          container.appendChild(col);
        });
      });
    }

    function showQuestions(category) {
      document.getElementById('selectedCategory').textContent = category;
      db.ref('questions').orderByChild('category').equalTo(category).once('value').then(snapshot => {
        const data = snapshot.val();
        const list = document.getElementById('questionList');
        list.innerHTML = '';
        for (let key in data) {
          const item = document.createElement('li');
          item.className = 'list-group-item d-flex justify-content-between align-items-start';
          item.innerHTML = `
            <div>${data[key].question}</div>
            <div class="btn-group">
              <button class="btn btn-sm btn-outline-primary" onclick="sendToClient('${key}')">👁️ Показать</button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion('${key}')">🗑️</button>
            </div>
          `;
          list.appendChild(item);
        }
      });
    }

    function deleteQuestion(id) {
      if (confirm("Удалить этот вопрос?")) {
        db.ref('questions/' + id).remove()
          .then(() => {
            const current = document.getElementById('selectedCategory').textContent;
            showQuestions(current);
          })
          .catch(err => alert("Ошибка при удалении: " + err.message));
      }
    }

    function sendToClient(id) {
      db.ref('questions/' + id).once('value').then(snapshot => {
        const data = snapshot.val();
        if (data) {
          db.ref('realtimeDisplay').set({
            id: data.id,
            category: data.category,
            question: data.question,
            timestamp: Date.now()
          });
        }
      });
    }

    loadCategories();
  </script>
</body>
</html>
